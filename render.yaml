services:
  - type: web
    name: social-media-downloader-youtube
    runtime: docker
    dockerfilePath: ./Dockerfile.youtube
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 3200
      - key: YOUTUBE_RESOLVE_SERVICE_TOKEN
        sync: false
      - key: YTDLP_YOUTUBE_TIMEOUT_MS
        value: 45000
